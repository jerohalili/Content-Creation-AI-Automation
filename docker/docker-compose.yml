version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_local_factory
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./documents:/home/node/documents # To store generated pictures
    environment:
      - N8N_HOST=localhost
    restart: always

  # Note: AnythingLLM and ComfyUI are often run as standalone 
  # desktop apps for GPU access, but can be added here if 
  # using specialized Docker images for local LLMs.

volumes:
  n8n_data: